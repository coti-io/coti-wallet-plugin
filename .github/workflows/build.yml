name: Build

on:
  push:
    branches: [main, development]
  workflow_dispatch:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        # Fails if coverage drops below the floors in vitest.config.ts.
        run: npm run test:coverage

      - name: Build
        run: npm run build
